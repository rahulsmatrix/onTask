<h2 class="centered-input">MY TASKS</h2>

<div class="alert alert-success" *ngIf='message'>{{message}}</div>

<div class="container">
    <table class="table">
        <thead>
            <tr>
                <th>Description</th>
                <th>Target Date</th>
                <th>Status</th>
                <th>Update</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let task of tasks">
                <td>{{task.description}}</td>
                <td>{{task.targetDate | date}}</td>
                <td>{{task.status}}</td>
                <td><button (click)="updateTask(task.id)" class="btn btn-success">Update</button></td>
                <td><button (click)="deleteTask(task.id)" class="btn btn-warning">Delete</button></td>
            </tr>
        </tbody>
    </table>

    <div class="button">
        <button (click)="addTask()" class="btn btn-success">Add</button>
    </div>

</div>
