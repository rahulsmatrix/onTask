<br>
<h2 class="centered-input">USER REGISTRATION</h2>
 
<div class="container centered-input">
    <form #Registerform="ngForm" (ngSubmit)="registerUser()">

        <div class="alert alert-warning" *ngIf='invalidUserInfo'>{{errorMessage}}</div>
        
        <!-- Success message -->
        <div class="alert alert-success" *ngIf='message && !invalidUserInfo'>
            {{message}}
        </div>
        
        <div class="form-group">
            <!-- <label for="firstName">First name :</label> -->
            <input type="firstName" class="form-control"
            style="width: 400px; margin: 0 auto; margin-bottom: 15px; display: block;" 
            placeholder="Enter first name" name="firstName" [(ngModel)]="user.firstName" required>
        </div>

        <div class="form-group">
            <!-- <label for="lastName">Last name :</label> -->
            <input type="lastName" class="form-control"
            style="width: 400px; margin: 0 auto; margin-bottom: 15px; display: block;" 
            placeholder="Enter last name" name="firstName" [(ngModel)]="user.lastName" required>
        </div>

        <div class="form-group">
            <!-- <label for="email">Email :</label> -->
            <input type="email" class="form-control"
            style="width: 400px; margin: 0 auto; margin-bottom: 15px; display: block;" 
            placeholder="Enter email" name="email" [(ngModel)]="user.email" required>
        </div>
        
        <div class="form-group">
            <!-- <label for="pwd">Password :</label> -->
            <input type="password" class="form-control"
            style="width: 400px; margin: 0 auto; margin-bottom: 15px; display: block;" 
            placeholder="Enter password" name="pwd" [(ngModel)]="user.password" required>
        </div>

        <div>
            <!-- <button (click)=loginUser() class="btn btn-success" [routerLink]="['/welcome', userId]">Login</button> -->
            <!-- <button (click)=basicAuthLogin() class="btn btn-success" [routerLink]="['/welcome', userId]">Login</button> -->
            <button type="submit" class="btn btn-success">Register</button>
            <button class="btn btn-danger float-end" (click)="cancelUserRegistration()">Cancel</button>
        </div>

        <div style="margin-top: 15px;">
            <!-- <a href="#" class="text-decoration-none">Forgot Password?</a> |  -->
            <span class="float-end">Already have an account? <a [routerLink]="['/login']">Login here</a></span>
        </div>

    </form>
</div>
